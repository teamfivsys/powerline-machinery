[project]
name = "powerline-fresh"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.8,<5.3",
    "whitenoise>=6.9,<7",
    "gunicorn>=23,<26",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
