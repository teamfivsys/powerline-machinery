{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">{{ eyebrow }}</p><h1>{{ title }}</h1></div></div><section class="panel form-panel"><p class="form-note">{{ note }}</p><form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}<div class="form-actions"><button class="button" type="submit">Save record</button><a class="button secondary" href="{% url cancel_url %}">Cancel</a></div></form></section>{% endblock %}
